  <style>
    :root {
      --navy:        #0B2E59;
      --primary:     #1B5FA8;
      --primary-dark:#134C89;
      --secondary:   #3FA0E0;
      --secondary-lt:#8FCBF0;
      --white:       #FFFFFF;
      --text:        #1B2632;
      --text-light:  #56677C;
      --gray-200:    #E3E9F1;
      --header-h:    80px;
      --badge-h:     63px;
      --ff-corpo:    'Inter', sans-serif;
      --ff-titulo:   'Poppins', sans-serif;
      --tr:          0.25s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar { display: none; }

    body { font-family: var(--ff-corpo); color: var(--text); background: var(--white); }
    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }
    img, svg { display: block; }

    .container { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 1.5rem; }

    /* ══════════ HEADER ══════════ */
    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      height: var(--header-h);
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--gray-200);
      box-shadow: 0 2px 16px rgba(11,46,89,0.08);
    }
    .header-inner { display: flex; align-items: center; justify-content: space-between; height: 100%; gap: 20px; }

    .brand-logo { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 44px; height: 44px; border-radius: 12px; background: var(--navy);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .brand-mark svg { width: 24px; height: 24px; }
    .brand-mark img { width: 24px; height: 24px; object-fit: contain; filter: brightness(0) invert(1); }
    .brand-text { display: flex; flex-direction: column; line-height: 1.05; }
    .brand-text strong { font-family: var(--ff-titulo); font-size: 1.2rem; font-weight: 800; color: var(--navy); letter-spacing: -0.01em; }
    .brand-text span { font-size: 0.64rem; font-weight: 600; color: var(--text-light); letter-spacing: 0.06em; text-transform: uppercase; }

    .nav-links { display: flex; align-items: center; gap: 1.6rem; }
    .nav-links a:not(.nav-cta) {
      font-size: 0.8rem; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
      color: var(--text); position: relative; transition: color var(--tr); white-space: nowrap;
    }
    .nav-links a:not(.nav-cta)::after {
      content: ''; position: absolute; bottom: -6px; left: 0; width: 0; height: 2px;
      background: var(--secondary); transition: width var(--tr);
    }
    .nav-links a:not(.nav-cta):hover { color: var(--primary-dark); }
    .nav-links a:not(.nav-cta):hover::after { width: 100%; }
    .nav-links a.active-page { color: var(--primary-dark); }
    .nav-links a.active-page::after { width: 100%; }

    .nav-cta {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--primary); color: var(--white);
      padding: 0.55rem 1.3rem; border-radius: 100px;
      font-size: 0.78rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
      transition: background var(--tr), transform var(--tr); white-space: nowrap;
    }
    .nav-cta svg { width: 15px; height: 15px; fill: currentColor; }
    .nav-cta:hover { background: var(--primary-dark); transform: translateY(-1px); }

    .hamburger { display: none; flex-direction: column; gap: 5px; padding: 8px; background: none; border: none; cursor: pointer; }
    .hamburger span { width: 24px; height: 2px; background: var(--navy); border-radius: 2px; transition: transform var(--tr), opacity var(--tr); }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    #navMenu {
      position: fixed; top: var(--header-h); left: 0; right: 0; z-index: 999;
      background: var(--white);
      max-height: 0; overflow: hidden;
      transition: max-height 0.35s ease;
      border-bottom: 1px solid var(--gray-200);
    }
    #navMenu.open { max-height: 420px; }
    #navMenu a {
      display: block; padding: 14px 24px;
      font-size: 0.85rem; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
      color: var(--text); border-bottom: 1px solid var(--gray-200);
      transition: color var(--tr), background var(--tr);
    }
    #navMenu a:hover { color: var(--primary-dark); background: #F0F4F9; }
    #navMenu .nav-cta { margin: 14px 24px 20px; text-align: center; justify-content: center; }

    /* ══════════ IFRAME VITRINE ══════════ */
    #vitrine-wrapper {
      position: fixed; top: var(--header-h); left: 0; right: 0; bottom: var(--badge-h);
      width: 100%;
    }
    #vitrine-frame {
      width: 100%; height: 100%;
      border: none; display: block;
    }

    /* ══════════ BADGE INFERIOR ══════════ */
    #vitrine-badge {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
      height: var(--badge-h);
      background: linear-gradient(135deg, var(--navy) 0%, var(--primary-dark) 100%);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem; gap: 12px;
      border-top: 2px solid var(--secondary);
    }
    .badge-back {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
      color: var(--white);
      background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.28);
      border-radius: 100px; padding: 0.45rem 1.1rem; white-space: nowrap;
      transition: background var(--tr), border-color var(--tr);
    }
    .badge-back svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .badge-back:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.55); }

    .badge-brand { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: center; }
    .badge-brand .brand-mark { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,0.14); }
    .badge-brand .brand-mark svg, .badge-brand .brand-mark img { width: 16px; height: 16px; }
    .badge-brand span { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.65); white-space: nowrap; }

    .badge-wa {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
      color: var(--white); background: #25D366; border: 1px solid #25D366;
      border-radius: 100px; padding: 0.45rem 1.1rem; white-space: nowrap;
      transition: background var(--tr);
    }
    .badge-wa svg { width: 14px; height: 14px; fill: currentColor; }
    .badge-wa:hover { background: #1da851; border-color: #1da851; }

    /* ══════════ RESPONSIVIDADE ══════════ */
    @media (max-width: 1023px) {
      .nav-links > a:not(.nav-cta) { display: none; }
      .nav-links > a.nav-cta { display: none; }
      .hamburger { display: flex; }
    }
    @media (max-width: 767px) {
      :root { --header-h: 68px; }
      .brand-mark { width: 36px; height: 36px; }
      .brand-mark svg, .brand-mark img { width: 20px; height: 20px; }
      .brand-text strong { font-size: 1.02rem; }
      .badge-brand span { display: none; }
    }
    @media (max-width: 599px) {
      :root { --badge-h: 58px; }
      #vitrine-badge { padding: 0 1rem; }
      .badge-back { padding: 0.4rem 0.85rem; font-size: 0.66rem; }
      .badge-wa { padding: 0.4rem 0.85rem; font-size: 0.66rem; }
      .badge-back span { display: none; }
    }
    @media (max-width: 420px) {
      .badge-brand { display: none; }
    }
  </style>

  <script>
    /* ── ALTURA DINÂMICA DO IFRAME ── */
    var headerEl = document.getElementById('header');
    var badgeEl  = document.getElementById('vitrine-badge');
    var vitrineFrame = document.getElementById('vitrine-frame');
    function resizeFrame() {
      var headerH = headerEl.offsetHeight;
      var badgeH  = badgeEl.offsetHeight;
      vitrineFrame.style.height = (window.innerHeight - headerH - badgeH) + 'px';
    }
    window.addEventListener('resize', resizeFrame);
    window.addEventListener('orientationchange', resizeFrame);
    resizeFrame();

    /* ── MENU MOBILE ── */
    var hamburger = document.getElementById('hamburger');
    var navMenu   = document.getElementById('navMenu');
    hamburger.addEventListener('click', function() {
      var open = navMenu.classList.toggle('open');
      hamburger.classList.toggle('open', open);
      hamburger.setAttribute('aria-expanded', open);
    });
    navMenu.querySelectorAll('a').forEach(function(a) {
      a.addEventListener('click', function() {
        navMenu.classList.remove('open');
        hamburger.classList.remove('open');
        hamburger.setAttribute('aria-expanded', 'false');
      });
    });
  </script>
